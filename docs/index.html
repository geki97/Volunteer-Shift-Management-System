<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.functions.supabase.co https://*.supabase.co; upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer">
    <title>Food Bank Volunteers</title>
    <link rel="stylesheet" href="./web/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Volunteers</h1>
            <p>Food Bank Management</p>
        </header>

        <main>
            <div class="welcome-section">
                <h2>Welcome</h2>
                <p>Manage your volunteer team and shifts</p>
            </div>

            <div class="tabs">
                <button class="tab-button active" data-tab="volunteers">Volunteers</button>
                <button class="tab-button" data-tab="shifts">Upcoming Shifts</button>
                <button class="tab-button" data-tab="checkin">Quick Check-In</button>
            </div>

            <div id="volunteers-tab" class="tab-content active">
                <h3>Active Volunteers</h3>
                <div id="volunteers-list" class="card-grid">
                    <div class="spinner"></div> Loading volunteers...
                </div>
            </div>

            <div id="shifts-tab" class="tab-content">
                <h3>Upcoming Shifts</h3>
                <div id="shifts-list" class="card-grid">
                    <div class="spinner"></div> Loading shifts...
                </div>
            </div>

            <div id="checkin-tab" class="tab-content">
                <h3>Check In</h3>
                <div class="card">
                    <p>Have a QR code? Enter your token to check in:</p>
                    <input type="text" id="token-input" class="input-field" placeholder="Enter token" style="width: 100%; max-width: 720px;">
                    <div style="margin-top: 12px;">
                        <a class="btn-primary" id="open-checkin-link" href="./check-in.html">Go to Check-In</a>
                    </div>
                </div>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Food Bank Volunteers</p>
            <p><a href="https://github.com/geki97/Volunteer-Shift-Management-System">GitHub</a></p>
        </footer>
    </div>

    <script src="./web/static/js/pages_config.js"></script>
    <script src="./web/static/js/pages_data.js"></script>
    <script src="./web/static/js/pages_home.js"></script>
</body>
</html>
