<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' https://*.functions.supabase.co https://*.supabase.co; upgrade-insecure-requests">
    <meta name="referrer" content="no-referrer">
    <title>Check In - Food Bank Volunteers</title>
    <link rel="stylesheet" href="./web/static/css/style.css" />
</head>
<body>
    <div class="container">
        <header>
            <h1>Check In</h1>
            <p>Record your arrival for today's shift</p>
        </header>

        <main>
            <div class="card">
                <h3>Shift Details</h3>
                <div id="shift-details">
                    <div class="spinner"></div> Loading...
                </div>
            </div>

            <div class="card">
                <h3>Volunteer Details</h3>
                <p id="volunteer-hint" style="color: var(--text-light); margin-bottom: 10px;">
                    Select your name from the list.
                </p>
                <select id="volunteer-select" class="input-field" style="width: 100%; max-width: 480px;"></select>
            </div>

            <div class="card">
                <h3>Confirm</h3>
                <button id="confirm-btn" class="btn-primary" style="margin-top: 12px;">Confirm Check-In</button>
                <div id="result" style="margin-top: 12px;"></div>
            </div>

            <div class="card">
                <h3>Back</h3>
                <a class="btn-primary" href="./index.html">Return to Home</a>
            </div>
        </main>

        <footer>
            <p>&copy; 2026 Food Bank Volunteers</p>
        </footer>
    </div>

    <script src="./web/static/js/pages_config.js"></script>
    <script src="./web/static/js/pages_data.js"></script>
    <script src="./web/static/js/pages_checkin.js"></script>
</body>
</html>
